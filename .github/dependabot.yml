# Dependabot configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/front-end"
      - "/back-end"
    schedule:
      interval: "weekly"
    # eslint-plugin-react (latest 7.37.5) only supports eslint <= 9, so eslint 10 can't install.
    # Remove this once eslint-plugin-react supports eslint 10.
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
    # Batch minor/patch bumps into one weekly PR; majors still get their own PR
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
