# Dependabot configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/front-end"
      - "/back-end"
    schedule:
      interval: "weekly"
    # Batch minor/patch bumps into one weekly PR; majors still get their own PR
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
